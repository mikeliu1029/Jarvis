<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --bg: #04070c; --panel: rgba(12, 28, 42, .55); --line: rgba(90, 200, 255, .18);
    --cyan: #5fd4ff; --cyan-dim: #2b6f8f; --text: #d9f2ff; --muted: #7aa3b8; --warn: #ffb547; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 22%, #0b2234 0%, var(--bg) 62%);
    color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  body::before { /* faint grid */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px; mask-image: radial-gradient(ellipse at 50% 30%, #000 10%, transparent 70%);
  }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 0; letter-spacing: .32em;
           font-size: 12px; color: var(--muted); position: relative; }
  header b { color: var(--cyan); font-weight: 600; }
  #clock { letter-spacing: .12em; font-variant-numeric: tabular-nums; }

  .reactor-wrap { display: flex; flex-direction: column; align-items: center; padding: 10px 0 4px; position: relative; }
  svg.reactor { width: 210px; height: 210px; overflow: visible; filter: drop-shadow(0 0 14px rgba(95,212,255,.45)); }
  .ring { transform-origin: 100px 100px; }
  .r1 { animation: spin 26s linear infinite; }
  .r2 { animation: spin 14s linear infinite reverse; }
  .r3 { animation: spin 40s linear infinite; }
  .core { transform-origin: 100px 100px; transition: opacity .3s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.12); opacity: 1 } }
  @keyframes breathe { 0%,100% { opacity: .55 } 50% { opacity: .9 } }
  body.idle .core { animation: breathe 4s ease-in-out infinite; }
  body.listening svg.reactor { filter: drop-shadow(0 0 26px rgba(200,240,255,.9)); }
  body.listening .core { animation: pulse .9s ease-in-out infinite; }
  body.thinking .r1 { animation-duration: 3s; } body.thinking .r2 { animation-duration: 1.6s; } body.thinking .r3 { animation-duration: 6s; }
  body.speaking .core { animation: pulse .45s ease-in-out infinite; }
  #state { margin-top: 8px; font-size: 11px; letter-spacing: .45em; color: var(--cyan); text-transform: uppercase; height: 16px; }

  .telemetry { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 6px 16px 10px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 3px; padding: 3px 8px; font-size: 11px;
          color: var(--muted); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.bad b { color: var(--bad); }

  #log { flex: 1; overflow-y: auto; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 8px;
         scrollbar-width: thin; scrollbar-color: var(--cyan-dim) transparent; }
  .msg { max-width: 92%; padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel);
         animation: rise .25s ease-out; word-wrap: break-word; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .msg .who { display: block; font-size: 10px; letter-spacing: .3em; color: var(--muted); margin-bottom: 2px; }
  .msg.jarvis { align-self: flex-start; border-left: 2px solid var(--cyan); }
  .msg.jarvis .who { color: var(--cyan); }
  .msg.user { align-self: flex-end; background: rgba(40, 60, 80, .45); }
  .msg.tool { align-self: flex-start; padding: 3px 10px; font: 11px/1.4 Consolas, monospace; color: var(--muted);
              background: transparent; border-style: dashed; }
  .msg.notice { align-self: center; color: var(--warn); border-color: rgba(255,181,71,.35); font-size: 12px; }

  form { display: flex; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid var(--line); background: rgba(4,10,16,.7); }
  input { flex: 1; min-width: 0; background: rgba(10, 24, 36, .9); border: 1px solid var(--line); color: var(--text);
          border-radius: 4px; padding: 10px 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(95,212,255,.15); }
  button { background: transparent; border: 1px solid var(--line); color: var(--cyan); border-radius: 4px; width: 42px;
           cursor: pointer; font-size: 16px; display: grid; place-items: center; }
  button:hover { border-color: var(--cyan); background: rgba(95,212,255,.08); }
  button svg { width: 18px; height: 18px; }
</style>
</head>
<body class="idle">
<header><span><b>J.A.R.V.I.S.</b></span><span id="clock">--:--</span></header>

<div class="reactor-wrap">
  <svg class="reactor" viewBox="0 0 200 200" aria-hidden="true">
    <defs>
      <radialGradient id="g" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#bff0ff"/>
        <stop offset="70%" stop-color="#5fd4ff" stop-opacity=".55"/><stop offset="100%" stop-color="#5fd4ff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g class="ring r3" fill="none" stroke="#5fd4ff" stroke-opacity=".35">
      <circle cx="100" cy="100" r="94" stroke-width="1"/>
      <circle cx="100" cy="100" r="88" stroke-width="6" stroke-dasharray="2 9"/>
    </g>
    <g class="ring r1" fill="none" stroke="#5fd4ff">
      <circle cx="100" cy="100" r="74" stroke-width="3" stroke-dasharray="58 20" stroke-opacity=".8"/>
    </g>
    <g class="ring r2" fill="none" stroke="#9fe6ff">
      <circle cx="100" cy="100" r="58" stroke-width="10" stroke-dasharray="14 8" stroke-opacity=".55"/>
      <circle cx="100" cy="100" r="46" stroke-width="1.5" stroke-opacity=".7"/>
    </g>
    <g class="core"><circle cx="100" cy="100" r="34" fill="url(#g)"/><circle cx="100" cy="100" r="16" fill="#e9fbff"/></g>
  </svg>
  <div id="state">standing by</div>
</div>

<div class="telemetry">
  <span class="chip">CPU <b id="cpu">--</b></span>
  <span class="chip">RAM <b id="ram">--</b></span>
  <span class="chip" id="brainchip">CORE <b id="brain">--</b></span>
  <span class="chip">VOICE <b id="voice">--</b></span>
</div>

<div id="log" aria-live="polite"></div>

<form id="f" autocomplete="off">
  <button type="button" id="mic" title="Talk (Ctrl+Alt+J)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <input id="q" placeholder="Type a command, sir…" autofocus>
  <button type="button" id="stop" title="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
</form>

<script>
const TOKEN = "__TOKEN__";
const log = document.getElementById("log"), stateEl = document.getElementById("state");
const LABELS = { idle: "standing by", listening: "listening", thinking: "processing", speaking: "speaking" };

function add(kind, text, who) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  if (who) { const w = document.createElement("span"); w.className = "who"; w.textContent = who; el.appendChild(w); }
  el.appendChild(document.createTextNode(text));
  log.appendChild(el);
  while (log.children.length > 120) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
function handle(e) {
  switch (e.type) {
    case "history": e.events.forEach(handle); break;
    case "state": document.body.className = e.value; stateEl.textContent = LABELS[e.value] || e.value; break;
    case "user": add("user", e.text, e.source === "voice" ? "YOU · VOICE" : "YOU"); break;
    case "jarvis": add("jarvis", e.text, "JARVIS"); break;
    case "tool": add("tool", "↳ " + e.name + (e.args ? " (" + e.args + ")" : "")); break;
    case "notice": add("notice", e.text); break;
    case "confirm": add("notice", "Confirm: " + e.text); break;
  }
}
function connect() {
  const es = new EventSource("/events?token=" + encodeURIComponent(TOKEN));
  es.onmessage = m => { try { handle(JSON.parse(m.data)); } catch (_) {} };
  es.onerror = () => { stateEl.textContent = "offline"; };
}
function post(path, body) {
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN },
                       body: JSON.stringify(body || {}) });
}
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault();
  const q = document.getElementById("q"), text = q.value.trim();
  if (text) { post("/api/command", { text }); q.value = ""; }
});
document.getElementById("mic").onclick = () => post("/api/listen");
document.getElementById("stop").onclick = () => post("/api/stop");

async function status() {
  try {
    const s = await (await fetch("/api/status")).json();
    document.getElementById("cpu").textContent = Math.round(s.cpu) + "%";
    document.getElementById("ram").textContent = Math.round(s.ram) + "%";
    document.getElementById("brain").textContent = s.brain_ok ? "ONLINE" : "FAULT";
    document.getElementById("brainchip").classList.toggle("bad", !s.brain_ok);
    document.getElementById("brainchip").title = s.brain;
    document.getElementById("voice").textContent = (s.voice || "").toUpperCase();
  } catch (_) {}
}
function tick() { const d = new Date(); document.getElementById("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
connect(); status(); tick();
setInterval(status, 4000); setInterval(tick, 10000);
</script>
</body>
</html>
